<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📋 Заказы</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ============================================
           ПРОСТЫЕ РАБОЧИЕ СТИЛИ
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 28px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 2px solid #e8e8e8;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .logo span {
            font-weight: 300;
            color: #888;
        }

        .nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .nav a {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            text-decoration: none;
            transition: all 0.2s;
            background: #f0f2f5;
        }
        .nav a:hover {
            background: #e0e0e0;
        }
        .nav a.active {
            background: #4a90d9;
            color: #ffffff;
        }

        .status-badge {
            font-size: 13px;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43a047;
            display: inline-block;
        }
        .status-badge.error {
            color: #c62828;
            background: #ffebee;
        }
        .status-badge.error .dot {
            background: #e53935;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .page-subtitle {
            font-size: 15px;
            color: #888;
            margin-bottom: 18px;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 14px;
        }
        .stats-row .stat-item {
            font-size: 14px;
            color: #888;
        }
        .stats-row .stat-item strong {
            color: #1a1a2e;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters input,
        .filters select {
            padding: 8px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #ffffff;
            transition: border-color 0.2s;
        }
        .filters input:focus,
        .filters select:focus {
            outline: none;
            border-color: #4a90d9;
        }
        .filters input {
            flex: 1;
            min-width: 180px;
        }

        .btn-outline {
            padding: 8px 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #ffffff;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-outline:hover {
            border-color: #4a90d9;
            background: #f0f7ff;
        }

        .table-wrapper {
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #e8e8e8;
            overflow: hidden;
        }

        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-weight: 700;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid #e8e8e8;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: #f8f9fa;
            z-index: 10;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid #f0f0f0;
            color: #1a1a2e;
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #f8f9fa;
        }

        .order-number {
            font-weight: 700;
            color: #4a90d9;
            font-size: 15px;
        }
        .order-date {
            font-size: 13px;
            color: #888;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            margin: 2px 2px 2px 0;
        }
        .tag-format {
            background: #e3f2fd;
            color: #1565c0;
        }
        .tag-format-hot {
            background: #fff3e0;
            color: #e65100;
        }
        .tag-caps {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .tag-other {
            background: #fff8e1;
            color: #f57c00;
        }
        .tag-cardboard {
            background: #f3e5f5;
            color: #6a1b9a;
        }
        .tag-astp {
            background: #e1f5fe;
            color: #0277bd;
        }
        .tag-quant {
            background: #fce4ec;
            color: #c2185b;
        }
        .tag-box {
            background: #efebe9;
            color: #5d4037;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 22px;
            border-radius: 12px;
            background: #1a1a2e;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            max-width: 380px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: #43a047;
        }
        .toast.error {
            background: #e53935;
        }
        .toast.info {
            background: #4a90d9;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 16px 12px;
                border-radius: 12px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .nav {
                width: 100%;
                justify-content: flex-start;
            }
            .nav a {
                font-size: 12px;
                padding: 5px 10px;
            }
            .page-title {
                font-size: 20px;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            .filters input {
                min-width: unset;
            }
            .stats-row {
                flex-direction: column;
                gap: 8px;
            }
            th,
            td {
                padding: 8px 10px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ХЕДЕР ===== -->
        <header class="header">
            <div class="logo">📦 <span>Учет материалов</span></div>
            <nav class="nav">
                <a href="index.html">📋 Отгрузка</a>
                <a href="dashboard.html">📊 Дашборд</a>
                <a href="balances.html">✏️ Остатки</a>
                <a href="reports.html">📈 Отчеты</a>
                <a href="orders.html" class="active">📑 Заказы</a>
            </nav>
            <div class="status-badge" id="statusBar">
                <span class="dot"></span>
                <span id="connectionStatus">Подключение...</span>
            </div>
        </header>

        <!-- ===== ЗАГОЛОВОК ===== -->
        <h1 class="page-title">📑 Список заказов</h1>
        <p class="page-subtitle">Все внесённые заказы с деталями</p>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats-row">
            <span class="stat-item">📦 Всего заказов: <strong id="totalOrders">0</strong></span>
            <span class="stat-item">📅 Сегодня: <strong id="todayOrders">0</strong></span>
            <span class="stat-item">📊 За месяц: <strong id="monthOrders">0</strong></span>
        </div>

        <!-- ===== ФИЛЬТРЫ ===== -->
        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по номеру заказа..." />
            <input type="date" id="dateFilter" />
            <button class="btn-outline" onclick="clearFilters()">❌ Сбросить</button>
            <button class="btn-outline" onclick="loadOrders()">🔄 Обновить</button>
            <button class="btn-outline" onclick="exportCSV()">📥 Экспорт CSV</button>
        </div>

        <!-- ===== ТАБЛИЦА ===== -->
        <div class="table-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th style="width:30px;">#</th>
                            <th style="min-width:120px;">Номер заказа</th>
                            <th style="min-width:100px;">Дата</th>
                            <th style="min-width:300px;">Состав заказа</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <tr>
                            <td colspan="4" class="empty-state">
                                ⏳ Загрузка данных...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ========================================== -->
    <!-- СКРИПТЫ -->
    <!-- ========================================== -->
    <script>
        var SUPABASE_URL = 'https://nlthrnqhwqetkggzrbpy.supabase.co';
        var SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sdGhybnFod3FldGtnZ3pyYnB5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Nzg0NTcxNywiZXhwIjoyMTAzNDIxNzE3fQ.TtvprePUVmHRfexGhX0YTjttxf57iMNoWUmIJ-TMPPw';

        if (typeof window.supabaseClient === 'undefined') {
            window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        var supabase = window.supabaseClient;

        var orders = [];
        var filteredOrders = [];

        var PACKAGE_NAMES = {
            'A6_BAG': 'А6',
            'A5_BAG': 'А5',
            'A7_KFC': 'А7 KFC',
            'BAG_60x40x30': '60×40×30',
            'BAG_70x100': '70×100',
            'BAG_60x80': '60×80',
            'RSM': 'RSM',
            'KSM': 'KSM',
            'RSTP': 'RSTP'
        };

        var BOX_NAMES = {
            'MB_SMALL': 'Малый MB',
            'AMAZON': 'Амазон',
            'STAND_BOX': 'Для стоек',
            'BOY_BIG': 'Пацанские большие',
            'OZON': 'Ozon хороший'
        };

        document.addEventListener('DOMContentLoaded', function() {
            checkConnection();
            loadOrders();

            document.getElementById('searchInput').addEventListener('input', applyFilters);
            document.getElementById('dateFilter').addEventListener('change', applyFilters);
        });

        function checkConnection() {
            var statusEl = document.getElementById('connectionStatus');
            var bar = document.getElementById('statusBar');

            supabase.from('materials').select('count').limit(1)
                .then(function(result) {
                    if (result.error) throw result.error;
                    statusEl.textContent = 'Подключено';
                    bar.className = 'status-badge';
                })
                .catch(function(error) {
                    console.error('Ошибка:', error);
                    statusEl.textContent = 'Ошибка';
                    bar.className = 'status-badge error';
                });
        }

        function loadOrders() {
            var tbody = document.getElementById('ordersBody');
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">⏳ Загрузка...</td></tr>';

            supabase.from('orders').select('*').order('created_at', { ascending: false })
                .then(function(result) {
                    if (result.error) throw result.error;
                    orders = result.data;
                    applyFilters();
                    updateStats();
                })
                .catch(function(error) {
                    console.error('Ошибка:', error);
                    tbody.innerHTML =
                        '<tr><td colspan="4" class="empty-state" style="color:#e53935;">❌ Ошибка загрузки: ' +
                        error.message + '</td></tr>';
                    showToast('❌ Ошибка загрузки: ' + error.message, 'error');
                });
        }

        function applyFilters() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var dateFilter = document.getElementById('dateFilter').value;

            filteredOrders = orders.filter(function(o) {
                var matchSearch = !search || (o.order_number && o.order_number.toLowerCase().includes(search));
                var matchDate = !dateFilter || o.order_date === dateFilter;
                return matchSearch && matchDate;
            });

            renderOrders();
        }

        function renderOrders() {
            var tbody = document.getElementById('ordersBody');

            if (filteredOrders.length === 0) {
                tbody.innerHTML =
                    '<tr><td colspan="4" class="empty-state"><div class="icon">📭</div>Заказов не найдено</td></tr>';
                return;
            }

            var html = '';
            for (var i = 0; i < filteredOrders.length; i++) {
                var o = filteredOrders[i];
                var details = buildDetails(o);

                html += '<tr>' +
                    '<td>' + (i + 1) + '</td>' +
                    '<td><span class="order-number">' + (o.order_number || '—') + '</span></td>' +
                    '<td><span class="order-date">' + formatDate(o.order_date) + '</span></td>' +
                    '<td>' + details + '</td>' +
                    '</tr>';
            }

            tbody.innerHTML = html;
        }

        function buildDetails(order) {
            var parts = [];

            // Форматы
            var formats = order.formats || [];
            if (typeof formats === 'string') {
                try { formats = JSON.parse(formats); } catch(e) { formats = []; }
            }
            if (Array.isArray(formats) && formats.length > 0) {
                for (var i = 0; i < formats.length; i++) {
                    var f = formats[i];
                    var name = PACKAGE_NAMES[f.code] || f.name || f.code;
                    var isHot = (f.code === 'RSM' || f.code === 'KSM' || f.code === 'RSTP');
                    var cls = isHot ? 'tag tag-format-hot' : 'tag tag-format';
                    parts.push('<span class="' + cls + '">' + name + ': ' + f.quantity + ' шт</span>');
                }
            }

            // NALEPKING
            if (order.has_caps) {
                parts.push('<span class="tag tag-caps">🎩 NALEPKING</span>');
            }

            // Другая упаковка
            if (order.has_other_pack) {
                parts.push('<span class="tag tag-other">📦 Другая упаковка</span>');
            }

            // Картон
            if (order.has_cardboard) {
                parts.push('<span class="tag tag-cardboard">📄 Картон</span>');
            }

            // ASTP
            if (order.has_astp && order.astp_quantity > 0) {
                parts.push('<span class="tag tag-astp">📦 ASTP: ' + order.astp_quantity + ' шт</span>');
            }

            // Кванты
            if (order.has_quant && order.quant_quantity > 0) {
                parts.push('<span class="tag tag-quant">📦 Кванты: ' + order.quant_quantity + ' шт</span>');
            }

            // Коробки
            var boxes = order.boxes || [];
            if (typeof boxes === 'string') {
                try { boxes = JSON.parse(boxes); } catch(e) { boxes = []; }
            }
            if (Array.isArray(boxes) && boxes.length > 0) {
                for (var j = 0; j < boxes.length; j++) {
                    var b = boxes[j];
                    var bname = BOX_NAMES[b.type] || b.type;
                    parts.push('<span class="tag tag-box">📦 ' + bname + ': ' + b.quantity + ' шт</span>');
                }
            }

            if (parts.length === 0) {
                return '<span style="color:#888;">Нет позиций</span>';
            }

            return parts.join(' ');
        }

        function updateStats() {
            document.getElementById('totalOrders').textContent = orders.length;

            var today = new Date().toISOString().split('T')[0];
            var todayCount = 0;
            var monthCount = 0;
            var currentMonth = today.substring(0, 7); // YYYY-MM

            for (var i = 0; i < orders.length; i++) {
                if (orders[i].order_date === today) todayCount++;
                if (orders[i].order_date && orders[i].order_date.substring(0, 7) === currentMonth) monthCount++;
            }

            document.getElementById('todayOrders').textContent = todayCount;
            document.getElementById('monthOrders').textContent = monthCount;
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilter').value = '';
            applyFilters();
        }

        function exportCSV() {
            if (filteredOrders.length === 0) {
                showToast('⚠️ Нет заказов для экспорта', 'info');
                return;
            }

            var headers = ['Номер заказа', 'Дата', 'Состав'];
            var rows = [];

            for (var i = 0; i < filteredOrders.length; i++) {
                var o = filteredOrders[i];
                var detailsText = buildDetailsText(o);
                rows.push([o.order_number || '', o.order_date || '', detailsText]);
            }

            var csv = headers.join(',') + '\n';
            for (var j = 0; j < rows.length; j++) {
                var row = rows[j];
                var escaped = row.map(function(cell) {
                    if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"') || cell.includes('\n'))) {
                        return '"' + cell.replace(/"/g, '""') + '"';
                    }
                    return cell;
                });
                csv += escaped.join(',') + '\n';
            }

            var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            var now = new Date();
            var dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            link.href = URL.createObjectURL(blob);
            link.download = 'заказы_' + dateStr + '.csv';
            link.click();
            URL.revokeObjectURL(link.href);

            showToast('📥 CSV файл скачан', 'success');
        }

        function buildDetailsText(order) {
            var parts = [];

            var formats = order.formats || [];
            if (typeof formats === 'string') {
                try { formats = JSON.parse(formats); } catch(e) { formats = []; }
            }
            if (Array.isArray(formats)) {
                for (var i = 0; i < formats.length; i++) {
                    var f = formats[i];
                    var name = PACKAGE_NAMES[f.code] || f.name || f.code;
                    parts.push(name + ': ' + f.quantity + ' шт');
                }
            }

            if (order.has_caps) parts.push('NALEPKING');
            if (order.has_other_pack) parts.push('Другая упаковка');
            if (order.has_cardboard) parts.push('Картон');
            if (order.has_astp && order.astp_quantity > 0) parts.push('ASTP: ' + order.astp_quantity + ' шт');
            if (order.has_quant && order.quant_quantity > 0) parts.push('Кванты: ' + order.quant_quantity + ' шт');

            var boxes = order.boxes || [];
            if (typeof boxes === 'string') {
                try { boxes = JSON.parse(boxes); } catch(e) { boxes = []; }
            }
            if (Array.isArray(boxes)) {
                for (var j = 0; j < boxes.length; j++) {
                    var b = boxes[j];
                    var bname = BOX_NAMES[b.type] || b.type;
                    parts.push(bname + ': ' + b.quantity + ' шт');
                }
            }

            return parts.join(' | ');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            var parts = dateStr.split('-');
            if (parts.length === 3) {
                return parts[2] + '.' + parts[1] + '.' + parts[0];
            }
            return dateStr;
        }

        function showToast(message, type) {
            type = type || 'info';
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(function() { toast.classList.add('show'); }, 10);
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }
    </script>

</body>
</html>
